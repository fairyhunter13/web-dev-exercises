name: Deploy

# Only after CI has gone green on main, so a deploy cannot race its own test
# suite and ship a build nothing verified.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Required for the OIDC token that is exchanged for AWS credentials. No access
  # key exists anywhere in this repository or its settings.
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish backend and frontend
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://d3irwxh641u3pi.cloudfront.net
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: chat/backend/go.mod
          cache-dependency-path: chat/backend/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat/frontend/package-lock.json

      # The role's trust policy pins this job's OIDC subject claim exactly, which
      # includes `environment: production` above. See infra/github_oidc.tf.
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      # CGO off so the binary is static: provided.al2023 is a minimal image and a
      # dynamically linked binary fails at startup as Runtime.InvalidEntrypoint,
      # which surfaces only in CloudWatch. Same flags as infra/deploy.sh.
      - name: Build the Lambda binary (linux/arm64)
        working-directory: chat/backend
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -tags lambda.norpc -trimpath -ldflags="-s -w" -o bootstrap ./cmd/lambda
          zip -j function.zip bootstrap

      - name: Publish the Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --zip-file fileb://chat/backend/function.zip \
            --output text --query 'LastModified'
          aws lambda wait function-updated --function-name "$FUNCTION"
        env:
          FUNCTION: ${{ secrets.LAMBDA_FUNCTION_NAME }}

      # Vite inlines the WebSocket URL at compile time, so it is a build input
      # rather than a runtime variable.
      - name: Build the frontend
        working-directory: chat/frontend
        env:
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
        run: |
          npm ci
          npm run build

      # Hashed assets are immutable and cached for a year; index.html is not
      # hashed, so caching it at the edge would make a deploy invisible to anyone
      # with a warm cache.
      - name: Upload to S3
        run: |
          aws s3 sync chat/frontend/dist "s3://$BUCKET" \
            --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp chat/frontend/dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache"
        env:
          BUCKET: ${{ secrets.SITE_BUCKET }}

      - name: Invalidate the edge cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DIST" --paths "/index.html" \
            --output text --query 'Invalidation.Status'
        env:
          DIST: ${{ secrets.DISTRIBUTION_ID }}

      # CloudFront can take a moment to serve the new index.html, so retry
      # before failing.
      - name: Verify the live site
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://d3irwxh641u3pi.cloudfront.net)
            [ "$code" = "200" ] && break
            sleep 10
          done
          test "$code" = "200"
          curl -s https://d3irwxh641u3pi.cloudfront.net | grep -q '<title>Realtime Chat</title>'

      # A 200 and a title prove the page is served, not that the app works. The
      # same suite CI runs locally is run against the deployed stack, so the
      # WebSocket, the Lambda and DynamoDB are all in the loop. playwright.config
      # drops the local servers and falls to one worker when E2E_BASE_URL is set,
      # because the live stage is rate limited.
      - name: End-to-end suite against the deployed stack
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        working-directory: chat/frontend
        env:
          E2E_BASE_URL: https://d3irwxh641u3pi.cloudfront.net

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-deployed
          path: chat/frontend/playwright-report
          # One day, not seven. Any signed-in GitHub user can download a public
          # repository's artifacts, and secret masking does not apply to their
          # contents - a report carries screenshots, traces and full request
          # URLs. It is only ever read to diagnose the run that produced it.
          retention-days: 1
